<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440" />
  <title>Smart OEE · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app/styles.css" />

  <!-- Dashboard-specific layout (kept here so it can be tweaked next to the markup) -->
  <style>
    /* 12-column grid for the Dashboard page. */
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: min-content;
      gap: 12px;
    }
    .dash-hero    { grid-column: span 4; min-height: 320px; }
    .dash-kpis    { grid-column: span 8; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .dash-chart   { grid-column: span 8; }
    .dash-target  { grid-column: span 4; }
    .dash-machines{ grid-column: span 8; }
    .dash-alarms  { grid-column: span 4; }
    .dash-downtime{ grid-column: span 6; }
    .dash-shift   { grid-column: span 6; }
    .dash-ai-slot { grid-column: span 12; }

    /* Variant: classic SCADA densifies the grid a notch. */
    .app[data-variant="scada"] .dash-grid { gap: 8px; }
    .app[data-variant="scada"] .card__body { padding: 10px 12px; }
    .app[data-variant="scada"] .dash-hero { min-height: 280px; }

    /* Make AI banner span the full content width above the grid. */
    .ai-banner { grid-column: span 12; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/icons.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/charts.jsx"></script>
  <script type="text/babel" src="app/chrome.jsx"></script>
  <script type="text/babel" src="app/dashboard.jsx"></script>
  <script type="text/babel" src="app/pages.jsx"></script>
  <script type="text/babel" src="app/plant3d.jsx"></script>
  <script type="text/babel" src="app/plantmap.jsx"></script>
  <script type="text/babel" src="app/settings.jsx"></script>
  <script type="text/babel" src="app/main.jsx"></script>
</body>
</html>
